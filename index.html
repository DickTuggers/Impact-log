  `;
  document.getElementById('closeDetail').onclick = ()=>{ view={screen:'home'}; render(); };
  document.querySelectorAll('[data-id]').forEach(el=>{
    el.onclick = ()=>{ view={screen:'sessionDetail', id:el.dataset.id}; render(); };
  });
}

function renderChallengeHistory(){
  const filters = [
    {key:'all', label:'All'},
    {key:'3', label:'5 Sets of 3'},
    {key:'1', label:'5 Arrows'},
    {key:'fatigue', label:'Fatigue Ladder'},
    {key:'cold', label:'Cold Shot'}
  ];
  const filtered = data.challenges.filter(c=>{
    if(challengeHistoryFilter==='all') return true;
    if(challengeHistoryFilter==='cold') return !!c.oneArrowMode;
    if(challengeHistoryFilter==='fatigue') return !!c.fatigueLadder;
    if(c.oneArrowMode || c.fatigueLadder) return false;
    return String(c.arrowsPerSet||3)===challengeHistoryFilter;
  });
  const sorted = [...filtered].sort((a,b)=> new Date(b.date)-new Date(a.date));
  $app.innerHTML = `
    <div class="flow-hdr"><div class="step-label">All Challenges</div><button class="close" id="closeDetail">‹ Back</button></div>
    <div class="chip-row" id="historyFilterChips" style="margin-bottom:14px;">
      ${filters.map(f=>`<button class="chip ${challengeHistoryFilter===f.key?'active':''}" data-filter="${f.key}">${f.label}</button>`).join('')}
    </div>
    <div class="panel"><span class="bl"></span><span class="br"></span>
      ${sorted.length===0 ? '<div class="empty">No challenges match this filter.</div>' :
        sorted.map(c=>{
          const t = challengeTotals(c);
          const aps = c.arrowsPerSet||3;
          const formatLabel = c.oneArrowMode ? 'Cold Shot' : c.fatigueLadder ? `Fatigue Ladder · ${aps} arrows` : (aps===1?'5 Arrows':'5 Sets of 3');
          return `<div class="row-item" data-challenge-id="${c.id}">
            <div><div class="t1">${fmtDate(c.date)}${c.label?' · '+escapeHtml(c.label):''}</div>
            <div class="t2">${formatLabel}</div></div>
            <div class="metric">${t.total}<span class="u">/${t.max}</span></div>
          </div>`;
        }).join('')
      }
    </div>
  `;
  document.getElementById('closeDetail').onclick = ()=>{ view={screen:'home'}; render(); };
  document.querySelectorAll('#historyFilterChips .chip').forEach(c=>{
    c.onclick = ()=>{ challengeHistoryFilter = c.dataset.filter; renderChallengeHistory(); };
  });
  document.querySelectorAll('[data-challenge-id]').forEach(el=>{
    el.onclick = ()=>{ view={screen:'challengeDetail', id:el.dataset.challengeId}; render(); };
  });
}

function renderChallengeDetail(){
  const challenge = getChallenge(view.id);
  if(!challenge){ view={screen:'home'}; render(); return; }
  const asset = getAsset(challenge.targetId);
  const totals = challengeTotals(challenge);
  const bow = challenge.bowId ? getBow(challenge.bowId) : null;
  const arrow = challenge.arrowSetupId ? getArrowSetup(challenge.arrowSetupId) : null;
  const equipLabel = [bow?bow.name:null, arrow?arrow.name:null].filter(Boolean).join(' · ');
  const {x:cx,y:cy} = challenge.centerOverridePx || asset.centerPx;
  const r = impactRadiusPx(asset);
  let dotsSvg = ringOverlaySvg(cx, cy, asset.pixelsPerInch, challenge.ringWidth);
  dotsSvg += `<line x1="${cx-14}" y1="${cy}" x2="${cx+14}" y2="${cy}" stroke="#E8A33D" stroke-width="1.5"/>
                 <line x1="${cx}" y1="${cy-14}" x2="${cx}" y2="${cy+14}" stroke="#E8A33D" stroke-width="1.5"/>`;
  challenge.sets.forEach((set,idx)=>{
    const color = PALETTE[idx%PALETTE.length];
    set.arrows.forEach(p=>{
      dotsSvg += `<circle cx="${p.xPx}" cy="${p.yPx}" r="${r}" fill="${color}" fill-opacity="0.9" stroke="#12140F" stroke-width="1.5"/>`;
    });
  });
  const rematchSource = challenge.rematchOf ? getChallenge(challenge.rematchOf) : null;
  let compareHtml = '';
  if(rematchSource){
    const oldTotals = challengeTotals(rematchSource);
    const delta = totals.total - oldTotals.total;
    compareHtml = `<div class="panel"><span class="bl"></span><span class="br"></span>
      <span class="label">Rematch result</span>
      <div class="stat-row">
        <div class="stat"><div class="num" style="color:var(--muted)">${oldTotals.total}</div><div class="cap">PREVIOUS · ${fmtDate(rematchSource.date)}</div></div>
        <div class="stat"><div class="num" style="color:var(--amber)">${totals.total}</div><div class="cap">THIS ATTEMPT</div></div>
        <div class="stat"><div class="num" style="color:${delta>=0?'var(--olive)':'var(--rust)'}">${delta>=0?'+':''}${delta}</div><div class="cap">CHANGE</div></div>
      </div>
    </div>`;
  }
  const bestMulti = getBestMultiChallenge();
  const bestCold = getBestColdShotChallenge();
  $app.innerHTML = `
    <div class="flow-hdr">
      <div class="step-label">${fmtDate(challenge.date)}${challenge.label?' · '+escapeHtml(challenge.label):''}</div>
      <button class="close" id="closeDetail">‹ Back</button>
    </div>
    ${equipLabel ? `<div class="instr" style="margin-bottom:8px;">${escapeHtml(equipLabel)}</div>` : ''}
    ${compareHtml}
    <div class="panel"><span class="bl"></span><span class="br"></span>
      <div class="stat-row">
        <div class="stat"><div class="num" style="color:var(--amber)">${totals.total}</div><div class="cap">/ ${totals.max} POINTS</div></div>
        <div class="stat"><div class="num">${challenge.ringWidth}"</div><div class="cap">RING WIDTH</div></div>
      </div>
    </div>
    ${challenge.fatigueLadder ? (()=>{
      const fb = fatigueBreakdown(challenge);
      return `<div class="panel"><span class="bl"></span><span class="br"></span>
        <span class="label">Fatigue breakdown — first ${fb.firstCount} vs last ${fb.secondCount}</span>
        <div class="stat-row">
          <div class="stat"><div class="num" style="color:var(--muted)">${fmt(fb.firstSpread,2)}"</div><div class="cap">FIRST HALF GROUP</div></div>
          <div class="stat"><div class="num" style="color:var(--amber)">${fmt(fb.secondSpread,2)}"</div><div class="cap">SECOND HALF GROUP</div></div>
          <div class="stat"><div class="num" style="color:${fb.deltaIn<=0?'var(--olive)':'var(--rust)'}">${fb.deltaIn>=0?'+':''}${fmt(fb.deltaIn,2)}"</div><div class="cap">FADE${fb.deltaPct!==null?' ('+(fb.deltaPct>=0?'+':'')+fmt(fb.deltaPct,0)+'%)':''}</div></div>
        </div>
      </div>`;
    })() : ''}
    <div class="tap-wrap"><img src="${asset.dataUrl}"><svg viewBox="0 0 ${asset.imgW} ${asset.imgH}">${dotsSvg}</svg></div>
    <div class="panel"><span class="bl"></span><span class="br"></span>
      <span class="label">${challenge.oneArrowMode ? 'Result' : 'By set'}</span>
      ${challenge.sets.map((set,idx)=>{
        const setTotal = set.arrows.reduce((a,ar)=>a+ar.score,0);
        const setMax = set.arrows.length*11;
        const unitLabel = challenge.oneArrowMode ? 'Arrow' : 'Set';
        return `<div class="row-item" style="cursor:default;">
          <div><span class="swatch" style="background:${PALETTE[idx%PALETTE.length]};display:inline-block;margin-right:6px;"></span><span class="t1">${unitLabel}${challenge.oneArrowMode?'':' '+set.setNumber}${set.distance?' · '+set.distance+'yd':''}</span>
          <div class="t2">${set.arrows.map(a=>a.score).join(' + ')}</div></div>
          <div class="metric">${setTotal}<span class="u">/${setMax}</span></div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn" id="rematchBtn" style="margin-bottom:8px;">Rematch This Challenge</button>
    ${!challenge.oneArrowMode && bestMulti && bestMulti.c.id!==challenge.id ? `<button class="btn secondary" id="rematchPrDetailBtn" style="margin-bottom:8px;">Rematch My PR</button>` : ''}
    ${challenge.oneArrowMode && bestCold && bestCold.id!==challenge.id ? `<button class="btn secondary" id="rematchBestColdBtn" style="margin-bottom:8px;">Rematch My Best Cold Shot</button>` : ''}
    <button class="btn danger" id="deleteChallengeBtn">Delete challenge</button>
  `;
  document.getElementById('closeDetail').onclick = ()=>{ view={screen:'home'}; render(); };
  document.getElementById('rematchBtn').onclick = ()=> startRematch(challenge.id);
  const rematchPrDetailBtn = document.getElementById('rematchPrDetailBtn');
  if(rematchPrDetailBtn) rematchPrDetailBtn.onclick = ()=> startRematch(bestMulti.c.id);
  const rematchBestColdBtn = document.getElementById('rematchBestColdBtn');
  if(rematchBestColdBtn) rematchBestColdBtn.onclick = ()=> startRematch(bestCold.id);
  document.getElementById('deleteChallengeBtn').onclick = async ()=>{
    if(!(await showConfirm('Delete this challenge? This cannot be undone.'))) return;
    data.challenges = data.challenges.filter(c=>c.id!==challenge.id);
    await saveData();
    view={screen:'home'}; render();
  };
}

// ---------- EQUIPMENT TRENDS ----------
let equipFilterBow = 'all';
let equipFilterArrow = 'all';
function renderEquipmentTrends(){
  const flat = allGroupingsFlat().filter(x=>(x.grouping.impacts||[]).length>0);
  const filtered = flat.filter(x=>{
    if(equipFilterBow!=='all' && x.session.bowId!==equipFilterBow) return false;
    if(equipFilterBow!=='all' && equipFilterArrow!=='all' && x.session.arrowSetupId!==equipFilterArrow) return false;
    return true;
  });
  const arrowOptions = equipFilterBow!=='all' ? arrowsForBow(equipFilterBow) : [];

  const spreadVals = filtered.map(x=>groupingMetrics(x.grouping).extremeSpread).filter(v=>v>0);
  const radiusVals = filtered.map(x=>groupingMetrics(x.grouping).meanRadius);
  const avgSpread = spreadVals.length ? spreadVals.reduce((a,v)=>a+v,0)/spreadVals.length : null;
  const avgRadius = radiusVals.length ? radiusVals.reduce((a,v)=>a+v,0)/radiusVals.length : null;

  $app.innerHTML = `
    <div class="flow-hdr"><div class="step-label">Equipment Trends</div><button class="close" id="closeDetail">‹ Back</button></div>
    <div class="panel"><span class="bl"></span><span class="br"></span>
      <span class="label">Filter</span>
      <label class="f-label">Bow</label>
      <select id="bowFilter">
        <option value="all" ${equipFilterBow==='all'?'selected':''}>All bows</option>
        ${data.bows.map(b=>`<option value="${b.id}" ${equipFilterBow===b.id?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}
      </select>
      <label class="f-label">Arrow setup</label>
      <select id="arrowFilter" ${equipFilterBow==='all'?'disabled':''}>
        <option value="all" ${equipFilterArrow==='all'?'selected':''}>All arrows for this bow</option>
        ${arrowOptions.map(a=>`<option value="${a.id}" ${equipFilterArrow===a.id?'selected':''}>${escapeHtml(a.name)}${a.weight?' · '+a.weight+'gr':''}</option>`).join('')}
      </select>
    </div>
    <div class="panel"><span class="bl"></span><span class="br"></span>
      <div class="stat-row">
        <div class="stat"><div class="num">${filtered.length}</div><div class="cap">GROUPINGS</div></div>
        <div class="stat"><div class="num" style="color:var(--amber)">${avgSpread!==null?fmt(avgSpread,1):'—'}"</div><div class="cap">AVG GROUP SIZE</div></div>
        <div class="stat"><div class="num" style="color:var(--olive)">${avgRadius!==null?fmt(avgRadius,1):'—'}"</div><div class="cap">AVG DIST FROM CENTER</div></div>
      </div>
    </div>
    <div class="panel"><span class="bl"></span><span class="br"></span>
      <span class="label">Trend for this equipment</span>
      <div id="equipTrendHolder"><canvas id="equipTrendCanvas" height="140"></canvas></div>
    </div>
  `;
  document.getElementById('closeDetail').onclick = ()=>{ view={screen:'home'}; render(); };
  document.getElementById('bowFilter').onchange = e=>{ equipFilterBow = e.target.value; equipFilterArrow='all'; renderEquipmentTrends(); };
  document.getElementById('arrowFilter').onchange = e=>{ equipFilterArrow = e.target.value; renderEquipmentTrends(); };

  const ctx = document.getElementById('equipTrendCanvas');
  if(filtered.length===0){
    ctx.parentElement.innerHTML = '<div class="trend-empty">No groupings logged yet for this equipment.</div>';
    return;
  }
  const labels = filtered.map(x=> fmtDate(x.grouping.createdAt) + (x.grouping.distance?' · '+x.grouping.distance+'yd':''));
  destroyChart('equipTrendCanvas');
  charts['equipTrendCanvas'] = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      { label:'Extreme spread (in)', data:filtered.map(x=>groupingMetrics(x.grouping).extremeSpread), borderColor:'#E8A33D', backgroundColor:'#E8A33D', tension:0.25, pointRadius:3, borderWidth:2 },
      { label:'Mean radius (in)', data:filtered.map(x=>groupingMetrics(x.grouping).meanRadius), borderColor:'#7FA65C', backgroundColor:'#7FA65C', tension:0.25, pointRadius:3, borderWidth:2, borderDash:[4,3] }
    ]},
    options:{ responsive:true,
      plugins:{ legend:{ labels:{ color:'#8B9184', font:{family:'IBM Plex Mono', size:10} } } },
      scales:{
        x:{ ticks:{ color:'#8B9184', font:{family:'IBM Plex Mono', size:9}, maxRotation:60, minRotation:60 }, grid:{ color:'#252B1D' } },
        y:{ ticks:{ color:'#8B9184', font:{family:'IBM Plex Mono', size:10} }, grid:{ color:'#252B1D' }, title:{display:true,text:'inches',color:'#8B9184',font:{family:'IBM Plex Mono',size:10}} }
      }
    }
  });
}

// ---------- EQUIPMENT CHANGES ----------
let expandedChangeId = null;
function computeChangeComparison(change){
  const changeDate = new Date(change.date);
  const sameBowChanges = data.equipmentChanges.filter(c=>c.bowId===change.bowId).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const idx = sameBowChanges.findIndex(c=>c.id===change.id);
  const nextChange = sameBowChanges[idx+1];
  const afterEnd = nextChange ? new Date(nextChange.date) : new Date();

  const allG = allGroupingsFlat().filter(x=> change.bowId ? x.session.bowId===change.bowId : true);
  const before = allG.filter(x=> new Date(x.grouping.createdAt) < changeDate);
  const after = allG.filter(x=> new Date(x.grouping.createdAt) >= changeDate && new Date(x.grouping.createdAt) < afterEnd);

  function aggregate(list){
    const withShots = list.filter(x=>(x.grouping.impacts||[]).length>0);
    if(!withShots.length) return null;
    const spreads = withShots.map(x=>groupingMetrics(x.grouping).extremeSpread).filter(v=>v>0);
    const radii = withShots.map(x=>groupingMetrics(x.grouping).meanRadius);
    return {
      groupings: withShots.length,
      avgSpread: spreads.length ? spreads.reduce((a,v)=>a+v,0)/spreads.length : null,
      avgRadius: radii.reduce((a,v)=>a+v,0)/radii.length
    };
  }
  return { before: aggregate(before), after: aggregate(after) };
}
function renderEquipmentChanges(){
  const sorted = [...data.equipmentChanges].sort((a,b)=> new Date(b.date)-new Date(a.date));
  $app.innerHTML = `
    <div class="flow-hdr"><div class="step-label">Equipment Changes</div><button class="close" id="closeDetail">‹ Back</button></div>
    <p class="instr">A log of gear changes you noted when starting sessions, with before/after impact comparisons for the same bow.</p>
    ${sorted.length===0 ? '<div class="empty">No equipment changes logged yet. You can note one the next time you start a new session.</div>' :
      sorted.map(c=>{
        const bow = c.bowId ? getBow(c.bowId) : null;
        const arrow = c.arrowSetupId ? getArrowSetup(c.arrowSetupId) : null;
        const equipLabel = [bow?bow.name:null, arrow?arrow.name:null].filter(Boolean).join(' · ') || 'No equipment set';
        const expanded = expandedChangeId===c.id;
        let compareHtml = '';
        if(expanded){
          const cmp = computeChangeComparison(c);
          compareHtml = `<div class="stat-row" style="margin-top:12px;">
            <div class="stat">
              <div class="cap" style="margin-bottom:6px;">BEFORE</div>
              <div class="num" style="color:var(--muted)">${cmp.before?fmt(cmp.before.avgSpread??0,1)+'"':'—'}</div>
              <div class="cap">AVG SPREAD · ${cmp.before?cmp.before.groupings:0} groupings</div>
            </div>
            <div class="stat">
              <div class="cap" style="margin-bottom:6px;">AFTER</div>
              <div class="num" style="color:var(--amber)">${cmp.after?fmt(cmp.after.avgSpread??0,1)+'"':'—'}</div>
              <div class="cap">AVG SPREAD · ${cmp.after?cmp.after.groupings:0} groupings</div>
            </div>
          </div>
          <div class="stat-row" style="margin-top:10px;">
            <div class="stat"><div class="num" style="color:var(--muted)">${cmp.before?fmt(cmp.before.avgRadius,1)+'"':'—'}</div><div class="cap">BEFORE · AVG DIST FROM CENTER</div></div>
            <div class="stat"><div class="num" style="color:var(--amber)">${cmp.after?fmt(cmp.after.avgRadius,1)+'"':'—'}</div><div class="cap">AFTER · AVG DIST FROM CENTER</div></div>
          </div>`;
        }
        return `<div class="panel" data-change="${c.id}" style="cursor:pointer;"><span class="bl"></span><span class="br"></span>
          <div class="t1">${fmtDate(c.date)}</div>
          <div class="t2" style="margin-bottom:8px;">${escapeHtml(equipLabel)}</div>
          <div class="instr" style="margin-bottom:0;">${escapeHtml(c.note)}</div>
          ${compareHtml}
        </div>`;
      }).join('')
    }
  `;
  document.getElementById('closeDetail').onclick = ()=>{ view={screen:'home'}; render(); };
  document.querySelectorAll('[data-change]').forEach(el=>{
    el.onclick = ()=>{ expandedChangeId = expandedChangeId===el.dataset.change ? null : el.dataset.change; renderEquipmentChanges(); };
  });
}

(async function init(){
  $app.innerHTML = '<div class="empty">Loading…</div>';
  await loadData();
  render();
})();

})();
